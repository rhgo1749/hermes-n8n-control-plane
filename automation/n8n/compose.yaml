name: hermes-n8n-control-plane

services:
  n8n:
    # Pin to the n8n upstream stable release selected for this migration.
    image: ${N8N_IMAGE:?set N8N_IMAGE in .env}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Deliberately private. Add a reviewed HTTPS reverse proxy before exposing
      # GitHub Trigger webhooks; do not publish this directly to the Internet.
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      NODE_ENV: production
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Workflow expressions and Code nodes cannot read process env/secrets.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_GIT_NODE_ENABLE_HOOKS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
    volumes:
      - n8n_data:/home/node/.n8n
      # Rendered workflow imports and exports only. No Docker socket, Hermes
      # home, source checkout, or host command mount is exposed to n8n.
      - ./state:/files
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  n8n_data:
    name: hermes-n8n-control-plane-data
