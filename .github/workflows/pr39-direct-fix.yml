name: PR39 direct fix

on:
  push:
    branches:
      - fix/head-binding-feedback-v2

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/head-binding-feedback-v2
          fetch-depth: 0

      - name: Rebase on latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Apply reason-aware head-binding feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('edge/kanban-github-sync.py')
          text = path.read_text()

          marker = 'REWORK_RETRY_MARKER = "AGENT_REWORK_RETRY"\n'
          insert = '''REWORK_RETRY_MARKER = "AGENT_REWORK_RETRY"\n\n# Delivery rejections caused by current-round PR-head binding.  These are\n# feedback-only diagnostics: state/retry/label routing is preserved.\nHEAD_BINDING_REJECT_REASONS = frozenset({\n    "rework_head_unchanged", "run_head_mismatch",\n})\n'''
          if 'HEAD_BINDING_REJECT_REASONS' not in text:
              if marker not in text:
                  raise SystemExit('constant anchor not found')
              text = text.replace(marker, insert, 1)

          sig_old = '''    evidence: Optional[Mapping[str, Any]] = None,\n) -> bool:\n'''
          sig_new = '''    evidence: Optional[Mapping[str, Any]] = None,\n    *,\n    requested_head: Optional[str] = None,\n) -> bool:\n'''
          start = text.index('def _post_rework_attention_pr_comment(')
          end = text.index('\n\ndef ', start + 10)
          fn = text[start:end]
          if 'requested_head: Optional[str]' not in fn:
              if sig_old not in fn:
                  raise SystemExit('attention signature anchor not found')
              fn = fn.replace(sig_old, sig_new, 1)

          template_anchor = '''    lines += [\n        "",\n        "Re-post the completion handoff on this PR with a comment whose first "\n'''
          guidance = '''    if reason == "rework_head_unchanged":\n        lines += [\n            "",\n            "Head-binding rejection: this ordinary rework round did not advance "\n            "the PR head beyond the round-requested head.",\n        ]\n        if requested_head:\n            lines += [f"Round-requested head: {requested_head}"]\n        lines += [\n            "Create and push a bounded worker-owned commit so the live PR head "\n            "advances, validate that new live head, then re-post "\n            "AGENT_REWORK_COMPLETE with the new full 40-char SHA.",\n        ]\n    elif reason == "run_head_mismatch":\n        lines += [\n            "",\n            "Head-attestation rejection: the completion marker/live PR head could "\n            "not be bound to the current round's finished worker run.",\n        ]\n        if requested_head:\n            lines += [f"Round-requested head: {requested_head}"]\n        lines += [\n            "The marker head must equal the live PR head, and the current round's "\n            "finished worker run summary/metadata must attest that same full SHA.",\n            "A new source commit is not inherently required. If the live head "\n            "already contains the requested fix, a trusted maintainer may open a "\n            "fresh AGENT_REWORK_RETRY verification-only round and the worker may "\n            "re-validate/attest that same head.",\n        ]\n\n'''
          if 'Head-attestation rejection:' not in fn:
              if template_anchor not in fn:
                  raise SystemExit('attention template anchor not found')
              fn = fn.replace(template_anchor, guidance + template_anchor, 1)
          text = text[:start] + fn + text[end:]

          # Add requested-head evidence to the two existing attention paths.
          old_call = '''                _post_rework_attention_pr_comment(\n                    client, ref, int(context["pr_number"]), task_id,\n                    reason=_delivery_reason, evidence=evidence,\n                )\n'''
          new_call = '''                event_payload = context.get("event")\n                requested_head = ""\n                if isinstance(event_payload, tuple) and event_payload and isinstance(\n                    event_payload[0], dict\n                ):\n                    requested_head = str(event_payload[0].get("head_sha") or "")\n                _post_rework_attention_pr_comment(\n                    client, ref, int(context["pr_number"]), task_id,\n                    reason=_delivery_reason, evidence=evidence,\n                    requested_head=requested_head or None,\n                )\n'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          old_call2 = '''                _post_rework_attention_pr_comment(\n                    client, ref, int(context["pr_number"]), task_id,\n                    reason=delivery_reason, evidence=evidence,\n                )\n'''
          new_call2 = '''                event_payload = context.get("event")\n                requested_head = ""\n                if isinstance(event_payload, tuple) and event_payload and isinstance(\n                    event_payload[0], dict\n                ):\n                    requested_head = str(event_payload[0].get("head_sha") or "")\n                _post_rework_attention_pr_comment(\n                    client, ref, int(context["pr_number"]), task_id,\n                    reason=delivery_reason, evidence=evidence,\n                    requested_head=requested_head or None,\n                )\n'''
          if old_call2 in text:
              text = text.replace(old_call2, new_call2, 1)

          # Retryable head-binding failures used to be silent.  Add feedback only,
          # preserving the requeue result and circuit-breaker behavior.
          retry_anchor = '''        result = _requeue_rework_task(\n            conn, kanban_db, task_id, context,\n            reason=delivery_reason, failure_limit=failure_limit,\n        )\n'''
          retry_insert = '''        if delivery_reason in HEAD_BINDING_REJECT_REASONS:\n            try:\n                event_payload = context.get("event")\n                requested_head = ""\n                if isinstance(event_payload, tuple) and event_payload and isinstance(\n                    event_payload[0], dict\n                ):\n                    requested_head = str(event_payload[0].get("head_sha") or "")\n                _post_rework_attention_pr_comment(\n                    client, ref, int(context["pr_number"]), task_id,\n                    reason=delivery_reason, evidence=evidence,\n                    requested_head=requested_head or None,\n                )\n            except GithubCompletionError as exc:\n                print(\n                    f"kanban-github-sync: head-bind feedback comment failed for "\n                    f"{ref.repository}#{context['pr_number']} task={task_id}: {exc}",\n                    file=sys.stderr,\n                )\n        result = _requeue_rework_task(\n            conn, kanban_db, task_id, context,\n            reason=delivery_reason, failure_limit=failure_limit,\n        )\n'''
          if 'head-bind feedback comment failed' not in text:
              if retry_anchor not in text:
                  raise SystemExit('retry anchor not found')
              text = text.replace(retry_anchor, retry_insert, 1)

          path.write_text(text)

          # Documentation: preserve PR #36 verification-only exception while
          # distinguishing ordinary same-head rejection from run attestation.
          dpath = Path('docs/EDGE_REWORK_LIFECYCLE.md')
          doc = dpath.read_text()
          checklist_anchor = '''- [ ] `head=<full 40-char SHA>` — exactly 40 lowercase hex characters AND\n      equal to the live remote PR head (`git rev-parse HEAD` == remote PR\n      head, verified by a fresh GitHub read);\n'''
          checklist_insert = checklist_anchor + '''- [ ] Ordinary rework rounds must advance beyond the round-requested\n      `head_sha`; same-head is rejected as `rework_head_unchanged`. The PR #36\n      verification-only maintainer-retry exception remains valid when the\n      trusted retry identity and current-run head attestation both bind.\n- [ ] The current round's finished worker run summary/metadata must attest the\n      same full SHA as the marker/live PR head. A `run_head_mismatch` may be an\n      attestation problem and does not by itself require another source commit.\n'''
          if 'A `run_head_mismatch` may be an' not in doc:
              if checklist_anchor not in doc:
                  raise SystemExit('doc checklist anchor not found')
              doc = doc.replace(checklist_anchor, checklist_insert, 1)

          paragraph_anchor = '''The comment body always carries the exact `AGENT_REWORK_COMPLETE`\nregeneration template and the `AGENT_REWORK_RETRY` instruction; for\n`completion_marker_malformed` it additionally lists the missing/invalid\nfields so the worker can re-post correctly without guessing.  The comment is\nfeedback only: it never changes state, never auto-retries, and posting\nfailure degrades to the existing hold without aborting reconciliation.\n'''
          paragraph_new = '''The comment body always carries the exact `AGENT_REWORK_COMPLETE`\nregeneration template and the `AGENT_REWORK_RETRY` instruction; for\n`completion_marker_malformed` it additionally lists the missing/invalid\nfields so the worker can re-post correctly without guessing. For\n`rework_head_unchanged`, the feedback names the round-requested head and\nrequires an ordinary worker-owned head advance. For `run_head_mismatch`, the\nfeedback instead requires marker/live/run attestation alignment and explicitly\ndoes **not** claim a new source commit is always required; an already-correct\nlive head may be re-verified through the trusted maintainer verification-only\nretry path from PR #36. The comment is feedback only: it never changes state,\nnever auto-retries, and posting failure degrades to the existing routing\nwithout aborting reconciliation.\n'''
          if 'does **not** claim a new source commit is always required' not in doc:
              if paragraph_anchor not in doc:
                  raise SystemExit('doc feedback paragraph anchor not found')
              doc = doc.replace(paragraph_anchor, paragraph_new, 1)
          dpath.write_text(doc)

          # Focused regressions: extend the current #36 tests rather than reuse
          # stale PR #33 tests 106-107.
          tpath = Path('edge/test-kanban-github-sync-rework.py')
          tests = tpath.read_text()

          # Existing verification-only success must produce no head-binding warning.
          v_anchor = '''    check("delivery event recorded", len([e for e in task_events(tid)\n                                          if e["kind"] == "github_pr_rework_delivery"]) == 1,\n          str(task_events(tid)))\n'''
          v_insert = v_anchor + '''    check("verification-only same-head posts no head-binding warning",\n          not _pr_attention_comments(fake, tid, "rework_head_unchanged")\n          and not _pr_attention_comments(fake, tid, "run_head_mismatch"),\n          str(_all_pr_comment_bodies(fake)))\n'''
          if 'verification-only same-head posts no head-binding warning' not in tests:
              if v_anchor not in tests:
                  raise SystemExit('test107 anchor not found')
              tests = tests.replace(v_anchor, v_insert, 1)

          add_anchor = '''\ndef main() -> int:\n'''
          new_tests = r'''

def test_116_same_head_rejection_feedback_reason_aware():
    print("116. ordinary same-head rejection -> reason-aware head-advance feedback")
    fake = fresh_env()
    head = "0123456789abcdef0123456789abcdef00000116"
    fake.prs[PR_N] = make_pr(PR_N, state="open", head_sha=head,
                             title="same-head feedback", body="body")
    fake.pr_labels[PR_N] = ["agent-rework"]
    fake.pr_timeline[PR_N] = labeled_timeline(LABEL_ADDED_OLD)
    fake.reviews[PR_N] = [review("rhgo1749", "CHANGES_REQUESTED",
                                 "fix it", "2026-08-10T00:00:10Z")]
    tid = new_task("review")
    run_sync(fake)
    payload = [e for e in task_events(tid) if e["kind"] == "github_pr_rework"][-1]["payload"]
    with connect_closing() as conn:
        claimed = kanban_db.claim_task(conn, tid)
        assert claimed is not None, "claim failed"
        conn.commit()
    _close_rework_run(tid, head=head, outcome="completed", summary="no change")
    with connect_closing() as conn:
        conn.execute("UPDATE tasks SET status='blocked', block_kind='needs_input', "
                     "completed_at=NULL WHERE id=?", (tid,))
        conn.commit()
    _post_completion_marker(fake, tid, head,
                            request_comment=payload.get("request_comment_id"))
    results = run_sync(fake)
    entries = [r for r in results if r.get("task_id") == tid]
    check("same-head rejected", any(r.get("diagnostic") == "rework_head_unchanged"
                                    for r in entries), str(entries))
    posted = _pr_attention_comments(fake, tid, "rework_head_unchanged")
    check("same-head feedback once", len(posted) == 1, str(posted))
    check("feedback names requested head", bool(posted) and head in posted[0],
          posted[0] if posted else "(none)")
    check("feedback requires ordinary head advance", bool(posted) and
          "advances" in posted[0] and "worker-owned commit" in posted[0],
          posted[0] if posted else "(none)")
    run_sync(fake)
    check("same-head feedback idempotent", len(
        _pr_attention_comments(fake, tid, "rework_head_unchanged")) == 1,
        str(_all_pr_comment_bodies(fake)))


def test_117_run_head_mismatch_feedback_is_attestation_specific():
    print("117. run-head mismatch -> attestation feedback, no unconditional new commit")
    fake, tid = _attention_blocked_retry_hold()
    retry_id = _post_retry_comment(fake, tid)
    run_sync(fake)
    with connect_closing() as conn:
        claimed = kanban_db.claim_task(conn, tid)
        assert claimed is not None, "retry round claim failed"
        conn.commit()
    requested_head = fake.prs[PR_N]["head"]["sha"]
    live_head = "0123456789abcdef0123456789abcdef00000117"
    run_head = "0123456789abcdef0123456789abcdef00000118"
    fake.prs[PR_N]["head"]["sha"] = live_head
    _close_rework_run(tid, head=run_head, outcome="completed",
                      summary="worker attested a different head")
    _post_completion_marker(fake, tid, live_head, request_comment=retry_id)
    results = run_sync(fake)
    entries = [r for r in results if r.get("task_id") == tid]
    check("run-head mismatch routed", any(
        r.get("diagnostic") == "run_head_mismatch"
        or r.get("retry_reason") == "run_head_mismatch" for r in entries), str(entries))
    posted = _pr_attention_comments(fake, tid, "run_head_mismatch")
    check("run-head feedback once", len(posted) == 1, str(posted))
    body = posted[0] if posted else ""
    check("attestation-specific wording", "finished worker run" in body
          and "must attest that same full SHA" in body, body)
    check("verification-only retry mentioned", "verification-only" in body
          and "AGENT_REWORK_RETRY" in body, body)
    check("no unconditional source-commit requirement",
          "A new source commit is not inherently required" in body, body)
    check("requested head named", requested_head in body, body)
    run_sync(fake)
    check("run-head feedback idempotent", len(
        _pr_attention_comments(fake, tid, "run_head_mismatch")) == 1,
        str(_all_pr_comment_bodies(fake)))
'''
          if 'def test_116_same_head_rejection_feedback_reason_aware' not in tests:
              if add_anchor not in tests:
                  raise SystemExit('test main anchor not found')
              tests = tests.replace(add_anchor, new_tests + add_anchor, 1)

          list_anchor = '''        test_114_normalization_and_rework_same_tick,\n        test_115_normalization_idempotent_across_ticks,\n'''
          list_new = list_anchor + '''        test_116_same_head_rejection_feedback_reason_aware,\n        test_117_run_head_mismatch_feedback_is_attestation_specific,\n'''
          if 'test_117_run_head_mismatch_feedback_is_attestation_specific,' not in tests:
              if list_anchor not in tests:
                  raise SystemExit('test list anchor not found')
              tests = tests.replace(list_anchor, list_new, 1)
          tpath.write_text(tests)
          PY

      - name: Validate
        run: |
          python3 -m py_compile edge/kanban-github-sync.py edge/test-kanban-github-sync-rework.py
          python3 edge/test-kanban-github-sync-rework.py
          git diff --check

      - name: Commit direct fix and self-remove workflow
        run: |
          git rm .github/workflows/pr39-direct-fix.yml
          git add edge/kanban-github-sync.py edge/test-kanban-github-sync-rework.py docs/EDGE_REWORK_LIFECYCLE.md .agent/pr-requests/REQ-032-head-binding-feedback-v2.md
          git commit -m "fix(edge): make head-binding feedback reason-aware"
          git push --force-with-lease origin HEAD:fix/head-binding-feedback-v2
