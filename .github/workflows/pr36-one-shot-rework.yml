name: PR36 one-shot rework

on:
  push:
    branches:
      - fix/edge-rework-verification-retry
    paths:
      - .github/workflows/pr36-one-shot-rework.yml

permissions:
  contents: write

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest main without committing yet
        run: |
          set -euxo pipefail
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Apply bounded PR36 follow-up patch
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          code = Path("edge/kanban-github-sync.py")
          replace_once(
              code,
              '''        if payload.get("trigger") == "maintainer_retry":
                      return delivery_payload
          ''',
              '''        if (
                      _rework_round_is_maintainer_retry(payload)
                      and delivery_payload.get("verification_only") is True
                      and delivery_payload.get("retry_comment_id")
                      == payload.get("retry_comment_id")
                      and delivery_payload.get("request_comment_id")
                      == payload.get("request_comment_id")
                  ):
                      return delivery_payload
          ''',
          )

          tests = Path("edge/test-kanban-github-sync-rework.py")
          test_block = r'''
          def test_116_verification_only_fast_path_preserves_review_ready():
              print("116. verification-only same-head delivery -> core review claim keeps "
                    "agent-review-ready (never downgrades to agent-working)")
              fake, tid = _attention_blocked_retry_hold()
              head = fake.prs[PR_N]["head"]["sha"]
              rcid = _post_retry_comment(fake, tid)
              run_sync(fake)  # consume trusted maintainer retry -> READY
              with connect_closing() as conn:
                  claimed = kanban_db.claim_task(conn, tid)
                  assert claimed is not None, "rework claim failed"
                  conn.commit()
              _close_rework_run(
                  tid,
                  head=head,
                  outcome="completed",
                  summary="verification: requested fixes already at head",
              )
              with connect_closing() as conn:
                  conn.execute(
                      "UPDATE tasks SET status='blocked', block_kind='needs_input', "
                      "completed_at=NULL WHERE id=?",
                      (tid,),
                  )
                  conn.commit()
              _post_completion_marker(fake, tid, head, request_comment=rcid)
              delivery_results = run_sync(fake)
              check(
                  "verification-only delivery -> review",
                  task_row(tid)["status"] == "review"
                  and any(r.get("reason") == "agent_review_ready"
                          for r in delivery_results if r.get("task_id") == tid),
                  str(delivery_results),
              )
              check(
                  "verification-only delivery label projected",
                  "agent-review-ready" in fake.pr_labels.get(PR_N, []),
                  str(fake.pr_labels),
              )

              # The core review lane now owns a RUNNING claim.  The active-claim
              # fast path must recognize the same-head verification-only delivery
              # as current-round evidence and preserve agent-review-ready.
              with connect_closing() as conn:
                  review_claim = kanban_db.claim_review_task(conn, tid)
                  assert review_claim is not None, "review claim failed"
                  conn.commit()
              results = run_sync(fake)
              entries = [r for r in results if r.get("task_id") == tid]
              check("core review claim stays running",
                    task_row(tid)["status"] == "running", str(task_row(tid)))
              check("fast path recognizes current verification-only delivery",
                    any(r.get("reason") == "agent_review_ready" for r in entries),
                    str(entries))
              check("review-ready preserved on review claim",
                    "agent-review-ready" in fake.pr_labels.get(PR_N, []),
                    str(fake.pr_labels))
              check("never downgraded to agent-working",
                    "agent-working" not in fake.pr_labels.get(PR_N, []),
                    str(fake.pr_labels))


          '''
          replace_once(tests, "def main() -> int:\n", test_block + "def main() -> int:\n")
          replace_once(
              tests,
              "        test_115_normalization_idempotent_across_ticks,\n",
              "        test_115_normalization_idempotent_across_ticks,\n"
              "        test_116_verification_only_fast_path_preserves_review_ready,\n",
          )

          docs = Path("docs/EDGE_REWORK_LIFECYCLE.md")
          replace_once(
              docs,
              '''6. Delivery events are written once per head (`_latest_delivery_head`), so
             repeated 5-minute ticks are no-ops after the transition.
          7. All GitHub label mutations are a single atomic PATCH with read-back
             verification; failures fail closed (task state preserved).
          ''',
              '''6. Delivery events are written once per head (`_latest_delivery_head`), so
             repeated reconciliation passes are no-ops after the transition.
          7. When a fresh `agent-rework` request arrives while stale
             `agent-review-ready` is still present, normalization removes only the stale
             review-ready label, refetches the live labels, and continues the new round's
             REVIEW -> READY evaluation in the **same reconciliation pass**.  If that
             refetch fails, reconciliation stops fail-closed until the next wake.
          8. All GitHub label mutations are a single atomic PATCH with read-back
             verification; failures fail closed (task state preserved).
          ''',
          )
          replace_once(
              docs,
              '''The live cron path is `~/.hermes/scripts/kanban-github-sync.py` driven by the
          5-minute intake job (`bf431b2a6ba6`).  Deploy this tracked copy with the
          candidate-copy protocol: backup -> copy candidate -> full regression suite ->
          cron-equivalent dry-run -> atomic `mv` -> post-replace verification.  This PR
          does **not** auto-deploy and does **not** merge itself.
          ''',
              '''The authoritative intake job remains Hermes job `default:bf431b2a6ba6`, but
          after PR #35 it is kept paused between **event-driven / async-only** wakes; n8n
          no longer owns a five-minute polling schedule for GitHub intake.  The canonical
          reconciliation source is `edge/kanban-github-sync.py`.  The deploy script
          installs that file as `$HERMES_HOME/scripts/kanban-github-sync-core.py`, while
          `$HERMES_HOME/scripts/kanban-github-sync.py` is the resource-admission entrypoint
          that delegates to the canonical core when no worker-resource policy changes the
          admission path.

          Deploy through `automation/hermes/scripts/deploy-intake-edge.sh` using its
          candidate-copy protocol: backup -> candidate validation -> dependency/core
          replacement -> entrypoint switch -> byte-for-byte post-install verification.
          The deploy step never edits the preserved Hermes job definition, schedule, or
          enabled state.  This PR does **not** auto-deploy and does **not** merge itself.
          ''',
          )
          replace_once(docs, "covers the lifecycle matrix (554 checks):", "covers the lifecycle matrix:")
          replace_once(
              docs,
              "Hermes core (`kanban_db.py`, tools, CLI) is untouched; all mutations are edge\n",
              "Tests 106-116 additionally pin the verification-only same-head retry, "
              "`review_requested` human hold, same-tick normalization, and the active "
              "core-review fast path that must preserve `agent-review-ready`.\n\n"
              "Hermes core (`kanban_db.py`, tools, CLI) is untouched; all mutations are edge\n",
          )
          PY

      - name: Static validation
        run: |
          set -euxo pipefail
          python3 -m py_compile edge/kanban-github-sync.py edge/test-kanban-github-sync-rework.py
          git diff --check

      - name: Direct fast-path trust-boundary test
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import sqlite3
          import sys

          spec = importlib.util.spec_from_file_location("kanban_github_sync", "edge/kanban-github-sync.py")
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.execute(
              "CREATE TABLE task_events ("
              "id INTEGER PRIMARY KEY AUTOINCREMENT, task_id TEXT, kind TEXT, "
              "payload TEXT, created_at INTEGER)"
          )
          task_id = "t_pr36_guard"
          head = "0123456789abcdef0123456789abcdef00000116"
          round_payload = {
              "trigger": "maintainer_retry",
              "retry_comment_id": 7001,
              "request_comment_id": 7001,
              "head_sha": head,
          }
          event = (round_payload, 100, "github_pr_rework")
          good = {
              "head": head,
              "verification_only": True,
              "retry_comment_id": 7001,
              "request_comment_id": 7001,
          }

          def observed(delivery):
              conn.execute("DELETE FROM task_events")
              conn.execute(
                  "INSERT INTO task_events(task_id, kind, payload, created_at) VALUES (?, ?, ?, ?)",
                  (task_id, "github_pr_rework_delivery", json.dumps(delivery), 100),
              )
              conn.commit()
              return mod._current_round_delivery(conn, task_id, event)

          assert observed(good) == good
          for bad in (
              {k: v for k, v in good.items() if k != "verification_only"},
              {k: v for k, v in good.items() if k != "retry_comment_id"},
              {**good, "verification_only": False},
              {**good, "retry_comment_id": 7002},
              {**good, "request_comment_id": 7002},
          ):
              assert observed(bad) is None, bad

          bad_round = dict(round_payload)
          bad_round.pop("retry_comment_id")
          event_without_retry_id = (bad_round, 100, "github_pr_rework")
          conn.execute("DELETE FROM task_events")
          conn.execute(
              "INSERT INTO task_events(task_id, kind, payload, created_at) VALUES (?, ?, ?, ?)",
              (task_id, "github_pr_rework_delivery", json.dumps(good), 100),
          )
          conn.commit()
          assert mod._current_round_delivery(conn, task_id, event_without_retry_id) is None
          print("PR36 fast-path trust boundary: PASS")
          PY

      - name: Full Hermes lifecycle suite when runtime is available
        run: |
          set -euxo pipefail
          if [ -x /ws/hermes-agent/venv/bin/python3 ] && [ -d /ws/hermes-agent/hermes_cli ]; then
            /ws/hermes-agent/venv/bin/python3 edge/test-kanban-github-sync-rework.py
          else
            echo "Full Hermes runtime is not present on this runner; full suite not executed here."
          fi

      - name: Remove one-shot workflow, commit and push
        run: |
          set -euxo pipefail
          rm -f .github/workflows/pr36-one-shot-rework.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge/kanban-github-sync.py edge/test-kanban-github-sync-rework.py docs/EDGE_REWORK_LIFECYCLE.md .github/workflows/pr36-one-shot-rework.yml
          git commit -m "fix: align verification-only fast path"
          git push origin HEAD:fix/edge-rework-verification-retry
